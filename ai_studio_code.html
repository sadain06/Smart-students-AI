<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ==========================================

        calendar: <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>,

        bell: <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>,

        copy: <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>,
        plus: <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>,
        trash: <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>,
        shield: <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      };
      return (

          strokeLinecap="round"
          strokeLinejoin="round"

    // ==========================================

        { id: 'u1', email: 'student@smartcampus.edu', role: 'STUDENT', fullName: 'Alex Vance', studentId: 'CSE-2024-001', dept: 'CSE', batch: '54th', semester: 6 },
        { id: 'u2', email: 'teacher@smartcampus.edu', role: 'TEACHER', fullName: 'Prof. Alan Turing', teacherId: 'T-CSE-01', dept: 'CSE', designation: 'Associate Professor' },
        { id: 'u3', email: 'admin@smartcampus.edu', role: 'ADMIN', fullName: 'Dr. Sarah Mitchell', adminId: 'A-01', designation: 'Academic Dean' }
      ],
      courses: [
        { id: 'c1', code: 'CSE-311', title: 'Database Management Systems', credits: 3.0, teacher: 'Prof. Alan Turing' },
        { id: 'c2', code: 'CSE-313', title: 'Operating Systems & Architecture', credits: 3.0, teacher: 'Prof. Alan Turing' },
        { id: 'c3', code: 'CSE-315', title: 'Artificial Intelligence & Neural Nets', credits: 3.0, teacher: 'Dr. John McCarthy' },
        { id: 'c4', code: 'CSE-317', title: 'Computer Networks', credits: 3.0, teacher: 'Prof. Vint Cerf' }
      ],
      attendance: [
        { courseId: 'c1', total: 24, present: 22 },  // 91.6%
        { courseId: 'c2', total: 20, present: 18 },  // 90.0%
        { courseId: 'c3', total: 22, present: 15 },  // 68.1% (Triggers Warning < 75%)
        { courseId: 'c4', total: 18, present: 16 }   // 88.8%
      ],
      results: [
        { semester: 5, code: 'CSE-301', title: 'Algorithms Design', credit: 3.0, marks: 87, grade: 'A+', gradePoint: 4.00 },
        { semester: 5, code: 'CSE-303', title: 'Software Engineering', credit: 3.0, marks: 81, grade: 'A', gradePoint: 3.75 },
        { semester: 5, code: 'CSE-305', title: 'Theory of Computation', credit: 3.0, marks: 76, grade: 'B+', gradePoint: 3.25 },
        { semester: 4, code: 'CSE-201', title: 'Data Structures', credit: 3.0, marks: 92, grade: 'A+', gradePoint: 4.00 },
        { semester: 4, code: 'CSE-203', title: 'Digital Logic Design', credit: 3.0, marks: 84, grade: 'A', gradePoint: 3.75 }
      ],
      routine: [
        { day: 'Monday', time: '09:00 - 10:30', code: 'CSE-311', title: 'Database Systems', room: 'Lab 402', teacher: 'Prof. Turing' },
        { day: 'Monday', time: '11:00 - 12:30', code: 'CSE-313', title: 'Operating Systems', room: 'Room 501', teacher: 'Prof. Turing' },
        { day: 'Tuesday', time: '10:00 - 11:30', code: 'CSE-315', title: 'Artificial Intelligence', room: 'Room 303', teacher: 'Dr. McCarthy' },
        { day: 'Wednesday', time: '09:00 - 10:30', code: 'CSE-317', title: 'Computer Networks', room: 'Lab 201', teacher: 'Prof. Cerf' },
        { day: 'Thursday', time: '14:00 - 15:30', code: 'CSE-311', title: 'Database Systems Lab', room: 'Lab 402', teacher: 'Prof. Turing' }
      ],
      assignments: [
        { id: 'a1', course: 'CSE-311', title: 'B+ Tree Index Simulation', deadline: '2026-10-28', status: 'Pending', description: 'Implement B+ Tree insertion & deletion algorithm in Python or C++.' },
        { id: 'a2', course: 'CSE-313', title: 'Multithreaded Dining Philosophers', deadline: '2026-10-31', status: 'Submitted', description: 'Solve deadlock using POSIX mutex and semaphores.' },
        { id: 'a3', course: 'CSE-315', title: 'A* Heuristic Search Implementation', deadline: '2026-10-15', status: 'Graded', score: 95, feedback: 'Excellent heuristic choice and documentation.' }
      ],
      notices: [
        { id: 'n1', title: 'Final Semester Examination Schedule Fall 2026', date: '2026-10-18', category: 'Exam', author: 'Academic Dean Office', content: 'Examinations for all 6th and 8th semester departments commence from Nov 15th.' },
        { id: 'n2', title: 'SmartCampus Hackathon 2026 Registrations', date: '2026-10-16', category: 'Event', author: 'CSE Club', content: 'Register your teams of 3-4 members for the 36-hour hackathon. Cash prizes up to $5,000.' },
        { id: 'n3', title: 'Lab Maintenance & Upgrade Scheduled', date: '2026-10-12', category: 'Administrative', author: 'IT Support', content: 'Lab 402 and 201 will undergo hardware and GPU driver updates this coming weekend.' }
      ],
      notes: [
        { id: 'nt1', title: 'ACID Properties & Serializability', category: 'Database', tags: 'dbms, transactions', content: 'Atomicity (WAL), Consistency (Invariants), Isolation (2PL, Snapshot), Durability (FSYNC).' },
        { id: 'nt2', title: 'CPU Scheduling Algorithms Cheat Sheet', category: 'OS', tags: 'threads, scheduling', content: 'FCFS (Convoy effect), SJF (Optimal avg waiting time, starvation risk), Round Robin (Time quantum selection).' }
      ],
      quizHistory: [
        { topic: 'Relational DBMS & SQL', score: 3, total: 3, percentage: 100, date: '2026-10-17' }
      ]
    };

    // Load or bootstrap database
    const loadDB = () => {
      const data = localStorage.getItem('smartcampus_db_v1');
      if (!data) {
        localStorage.setItem('smartcampus_db_v1', JSON.stringify(INITIAL_DB));
        return INITIAL_DB;
      }
      return JSON.parse(data);
    };

    const saveDB = (db) => {
      localStorage.setItem('smartcampus_db_v1', JSON.stringify(db));
    };

    // ==========================================
    // 3. MAIN APPLICATION COMPONENT
    // ==========================================
    function App() {
      const [db, setDb] = useState(loadDB);
      const [currentUser, setCurrentUser] = useState(() => db.users[0]); // default Alex Vance
      const [activeTab, setActiveTab] = useState('dashboard');
      const [darkMode, setDarkMode] = useState(false);
      const [globalSearch, setGlobalSearch] = useState('');
      const [showNotifications, setShowNotifications] = useState(false);

      // Save database sync
      useEffect(() => {
        saveDB(db);
      }, [db]);

      // Toggle Dark Mode
      const toggleTheme = () => {
        setDarkMode(!darkMode);
        document.documentElement.classList.toggle('dark');
      };

      // GPA/CGPA Calculators
      const { semesterGPA, overallCGPA } = useMemo(() => {
        const studentResults = db.results;
        if (!studentResults.length) return { semesterGPA: '0.00', overallCGPA: '0.00' };

        // Overall CGPA
        const totalCredits = studentResults.reduce((acc, r) => acc + r.credit, 0);
        const totalPoints = studentResults.reduce((acc, r) => acc + (r.credit * r.gradePoint), 0);
        const cgpa = (totalPoints / totalCredits).toFixed(2);

        // Current semester (Semester 5) GPA
        const sem5 = studentResults.filter(r => r.semester === 5);
        const sem5Credits = sem5.reduce((acc, r) => acc + r.credit, 0);
        const sem5Points = sem5.reduce((acc, r) => acc + (r.credit * r.gradePoint), 0);
        const sgpa = (sem5Points / sem5Credits).toFixed(2);

        return { semesterGPA: sgpa, overallCGPA: cgpa };
      }, [db.results]);

      // Overall Attendance Calculation
      const attendanceSummary = useMemo(() => {
        return db.attendance.map(att => {
          const course = db.courses.find(c => c.id === att.courseId);
          const pct = Math.round((att.present / att.total) * 100);
          return {
            ...att,
            courseCode: course ? course.code : 'Course',
            courseTitle: course ? course.title : 'Unknown',
            percentage: pct,
            warning: pct < 75
          };
        });
      }, [db.attendance, db.courses]);

      const hasAttendanceAlert = attendanceSummary.some(a => a.warning);

      // Handle Quick Role Switching for demo testing
      const switchRole = (role) => {
        const user = db.users.find(u => u.role === role);
        if (user) {
          setCurrentUser(user);
          setActiveTab('dashboard');
        }
      };

      return (
        <div className="min-h-screen flex flex-col md:flex-row bg-slate-50 dark:bg-slate-900 transition-colors duration-200">
          
          {/* SIDEBAR NAVIGATION */}
          <aside className="w-full md:w-64 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col shrink-0 select-none">
            <div className="p-5 flex items-center justify-between border-b border-slate-100 dark:border-slate-700">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-500 flex items-center justify-center text-white font-black shadow-md shadow-brand-500/20">
                  S
                </div>
                <div>
                  <h1 className="font-extrabold text-base bg-gradient-to-r from-brand-600 to-indigo-500 bg-clip-text text-transparent">SmartCampus AI</h1>
                  <span className="text-[10px] tracking-widest text-slate-400 uppercase font-semibold">University Portal</span>
                </div>
              </div>
            </div>

            {/* Quick Role Switcher pills for easy grading/evaluation */}
            <div className="px-4 pt-4 pb-2">
              <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider mb-2">Switch Active Role</p>
              <div className="grid grid-cols-3 gap-1 bg-slate-100 dark:bg-slate-700/60 p-1 rounded-xl text-xs font-semibold">
                <button
                  onClick={() => switchRole('STUDENT')}
                  className={`py-1.5 rounded-lg transition ${currentUser.role === 'STUDENT' ? 'bg-white dark:bg-slate-800 text-brand-600 shadow-sm' : 'text-slate-500'}`}
                >Student</button>
                <button
                  onClick={() => switchRole('TEACHER')}
                  className={`py-1.5 rounded-lg transition ${currentUser.role === 'TEACHER' ? 'bg-white dark:bg-slate-800 text-brand-600 shadow-sm' : 'text-slate-500'}`}
                >Teacher</button>
                <button
                  onClick={() => switchRole('ADMIN')}
                  className={`py-1.5 rounded-lg transition ${currentUser.role === 'ADMIN' ? 'bg-white dark:bg-slate-800 text-brand-600 shadow-sm' : 'text-slate-500'}`}
                >Admin</button>
              </div>
            </div>

            <nav className="flex-1 px-3 py-4 space-y-1 overflow-y-auto custom-scrollbar text-sm font-medium">

              >
                <Icon name="dashboard" /> Dashboard
              </button>

              {currentUser.role === 'STUDENT' && (
                <React.Fragment>
                  <button
                    onClick={() => setActiveTab('attendance')}

                      <Icon name="checkCircle" /> Attendance

                    {hasAttendanceAlert && (
                      <span className="w-2 h-2 rounded-full bg-rose-500 animate-pulse"></span>

                  <button
                    onClick={() => setActiveTab('results')}
                    className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition ${activeTab === 'results' ? 'bg-brand-50 dark:bg-brand-900/40 text-brand-600 dark:text-brand-400 font-semibold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/40'}`}
                  >
                    <Icon name="award" /> Results & GPA
                  </button>
                  <button
                    onClick={() => setActiveTab('routine')}

                  >
                    <Icon name="calendar" /> Class Routine
                  </button>
                  <button
                    onClick={() => setActiveTab('assignments')}
                    className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition ${activeTab === 'assignments' ? 'bg-brand-50 dark:bg-brand-900/40 text-brand-600 dark:text-brand-400 font-semibold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/40'}`}
                  >
                    <Icon name="book" /> Assignments
                  </button>
                  <button
                    onClick={() => setActiveTab('notes')}

                  >
                    <Icon name="bot" /> AI Study Assistant
                  </button>
                  <button
                    onClick={() => setActiveTab('ai-quiz')}
                    className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition ${activeTab === 'ai-quiz' ? 'bg-brand-50 dark:bg-brand-900/40 text-brand-600 dark:text-brand-400 font-semibold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/40'}`}
                  >

                </React.Fragment>
              )}

              {currentUser.role === 'TEACHER' && (
                <React.Fragment>
                  <button

                  <button
                    onClick={() => setActiveTab('teacher-results')}
                    className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition ${activeTab === 'teacher-results' ? 'bg-brand-50 dark:bg-brand-900/40 text-brand-600 dark:text-brand-400 font-semibold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/40'}`}
                  >
                    <Icon name="award" /> Upload Results
                  </button>
                  <button
                    onClick={() => setActiveTab('assignments')}
                    className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition ${activeTab === 'assignments' ? 'bg-brand-50 dark:bg-brand-900/40 text-brand-600 dark:text-brand-400 font-semibold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/40'}`}

                </React.Fragment>
              )}

              {currentUser.role === 'ADMIN' && (
                <React.Fragment>
                  <button
                    onClick={() => setActiveTab('admin-users')}
                    className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition ${activeTab === 'admin-users' ? 'bg-brand-50 dark:bg-brand-900/40 text-brand-600 dark:text-brand-400 font-semibold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/40'}`}

                    <Icon name="user" /> User Management
                  </button>
                  <button
                    onClick={() => setActiveTab('admin-courses')}
                    className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition ${activeTab === 'admin-courses' ? 'bg-brand-50 dark:bg-brand-900/40 text-brand-600 dark:text-brand-400 font-semibold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700/40'}`}

              <button

    function AIChatView() {
      const [messages, setMessages] = useState([

      const [input, setInput] = useState('');
      const [isThinking, setIsThinking] = useState(false);

      const generateAIResponse = (query) => {
        const q = query.toLowerCase();
        if (q.includes('bcnf') || q.includes('normalization') || q.includes('database')) {
          return `### Database Normalization & BCNF\n\n1. **BCNF (Boyce-Codd Normal Form)**:\n   A relation $R$ is in BCNF if for every non-trivial functional dependency $X \\rightarrow Y$, $X$ is a **Super Key**.\n2. **Difference with 3NF**:\n   3NF permits $Y$ to be a prime attribute even if $X$ is not a super key. BCNF strictly eliminates all anomalies arising from non-super key determinants.`;
        }
        if (q.includes('deadlock') || q.includes('os') || q.includes('process')) {
          return `### OS Deadlock: 4 Necessary Coffman Conditions\n\n1. **Mutual Exclusion**: Non-shareable resource allocation.\n2. **Hold and Wait**: Process holding resources while waiting for more.\n3. **No Preemption**: Resources cannot be forcibly taken away.\n4. **Circular Wait**: A closed loop of processes waiting for chained resources.\n\n*Solution*: Use Dijkstra's Banker's Algorithm for avoidance.`;
        }
        return `### Academic Concept Explanation: "${query}"\n\n- **Fundamental Concept**: In CSE and engineering systems, this relates to core algorithmic efficiency and systemic guarantees.\n- **Exam Strategy**: Always define the principle, state worst-case complexity ($O(N)$ or $O(\\log N)$), and provide a concrete trace diagram.`;
      };

      const handleSend = (e) => {
        e.preventDefault();
        if (!input.trim() || isThinking) return;

        const userMsg = { id: 'u_' + Date.now(), sender: 'user', text: input };
        setMessages(prev => [...prev, userMsg]);
        const currentQuery = input;
        setInput('');
        setIsThinking(true);

        setTimeout(() => {
          const aiMsg = {
            id: 'a_' + Date.now(),
            sender: 'assistant',
            text: generateAIResponse(currentQuery)
          };
          setMessages(prev => [...prev, aiMsg]);
          setIsThinking(false);
        }, 600);
      };

      return (
        <div className="max-w-4xl mx-auto h-[calc(100vh-10rem)] flex flex-col bg-white dark:bg-slate-800 rounded-3xl border border-slate-100 dark:border-slate-700 shadow-sm overflow-hidden">

              <div className="p-2 bg-brand-50 dark:bg-brand-900/40 text-brand-600 rounded-xl">
                <Icon name="bot" className="w-5 h-5" />
              </div>
              <div>
                <h3 className="font-bold text-sm">AI Study Assistant</h3>
                <span className="text-[11px] text-emerald-500 font-semibold">● Ready for syllabus tutoring</span>
              </div>
            </div>
            <button
              onClick={() => setMessages([messages[0]])}
              className="p-2 text-slate-400 hover:text-rose-500"
              title="Clear Chat"
            >
              <Icon name="trash" className="w-4 h-4" />
            </button>
          </div>

          <div className="flex-1 p-5 overflow-y-auto space-y-4 custom-scrollbar text-xs md:text-sm">
            {messages.map((m) => (
              <div key={m.id} className={`flex gap-3 max-w-2xl ${m.sender === 'user' ? 'ml-auto flex-row-reverse' : ''}`}>
                <div className={`w-8 h-8 rounded-full shrink-0 flex items-center justify-center font-bold text-xs ${
                  m.sender === 'user' ? 'bg-brand-600 text-white' : 'bg-slate-100 dark:bg-slate-700 text-brand-600'
                }`}>
                  {m.sender === 'user' ? 'A' : <Icon name="bot" className="w-4 h-4" />}
                </div>
                <div className={`p-4 rounded-2xl whitespace-pre-wrap leading-relaxed ${
                  m.sender === 'user'
                    ? 'bg-brand-600 text-white'
                    : 'bg-slate-50 dark:bg-slate-700/50 text-slate-800 dark:text-slate-100 border border-slate-100 dark:border-slate-700'
                }`}>
                  {m.text}
                </div>
              </div>
            ))}
            {isThinking && (
              <div className="flex gap-3 text-xs text-slate-400 items-center">
                <div className="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center">

    // --- AI QUIZ GENERATOR VIEW ---
    function AIQuizView({ history, onSaveResult }) {
      const [topic, setTopic] = useState('Database Management Systems');
      const [difficulty, setDifficulty] = useState('Medium');
      const [activeQuestions, setActiveQuestions] = useState(null);
      const [currentIdx, setCurrentIdx] = useState(0);
      const [selectedOptions, setSelectedOptions] = useState({});
      const [isFinished, setIsFinished] = useState(false);
      const [score, setScore] = useState(0);

      const QUESTION_BANK = {
        'Database Management Systems': [
          {
            q: 'Which normal form eliminates partial functional dependencies on candidate keys?',
            options: ['1NF', '2NF', '3NF', 'BCNF'],
            ans: '2NF',
            exp: '2NF requires relation to be in 1NF and no non-prime attribute should be partially dependent on any candidate key.'
          },
          {
            q: 'What is the standard time complexity for search in a balanced B+ Tree of order m with N keys?',
            options: ['O(N)', 'O(log N)', 'O(N log N)', 'O(1)'],
            ans: 'O(log N)',
            exp: 'B+ Tree lookups traverse from root to leaf in O(log_m N) time.'
          },
          {
            q: 'Which ACID property is guaranteed by the Write-Ahead Logging (WAL) protocol?',
            options: ['Atomicity & Durability', 'Isolation', 'Consistency', 'Replication'],
            ans: 'Atomicity & Durability',
            exp: 'WAL ensures all updates are written to disk before transactions commit, guaranteeing recovery.'
          }
        ]
      };

      const handleStart = (e) => {
        e.preventDefault();
        const questions = QUESTION_BANK[topic] || QUESTION_BANK['Database Management Systems'];
        setActiveQuestions(questions);
        setCurrentIdx(0);
        setSelectedOptions({});
        setIsFinished(false);
      };

      const handleSelect = (opt) => {
        if (selectedOptions[currentIdx]) return;
        setSelectedOptions({ ...selectedOptions, [currentIdx]: opt });
      };

      const handleFinish = () => {
        let sc = 0;
        activeQuestions.forEach((q, i) => {
          if (selectedOptions[i] === q.ans) sc++;
        });
        setScore(sc);
        setIsFinished(true);
        onSaveResult({
          topic,
          score: sc,
          total: activeQuestions.length,
          percentage: Math.round((sc / activeQuestions.length) * 100),
          date: new Date().toISOString().split('T')[0]
        });
      };

      return (
        <div className="max-w-3xl mx-auto space-y-6">
          {!activeQuestions && (
            <div className="p-6 md:p-8 bg-white dark:bg-slate-800 rounded-3xl border border-slate-100 dark:border-slate-700 shadow-sm space-y-5">
              <div className="flex items-center gap-3">
                <div className="p-3 bg-brand-50 dark:bg-brand-900/40 text-brand-600 rounded-2xl">
                  <Icon name="quiz" className="w-6 h-6" />
                </div>
                <div>
                  <h2 className="text-lg font-bold">AI Practice Quiz Generator</h2>
                  <p className="text-xs text-slate-400">Generate interactive multiple-choice test sets for exam self-assessment.</p>
                </div>
              </div>

              <form onSubmit={handleStart} className="space-y-4 text-xs">
                <div>
                  <label className="block font-bold uppercase text-slate-400 mb-1">Subject / Domain</label>
                  <select
                    value={topic}
                    onChange={(e) => setTopic(e.target.value)}
                    className="w-full p-3 bg-slate-50 dark:bg-slate-700 rounded-xl"
                  >
                    <option value="Database Management Systems">Database Management Systems</option>
                    <option value="Operating Systems">Operating Systems & Kernels</option>
                    <option value="Computer Networks">Computer Networks & OSI Model</option>
                  </select>
                </div>

                <div>
                  <label className="block font-bold uppercase text-slate-400 mb-1">Difficulty Level</label>
                  <select
                    value={difficulty}
                    onChange={(e) => setDifficulty(e.target.value)}
                    className="w-full p-3 bg-slate-50 dark:bg-slate-700 rounded-xl"
                  >
                    <option value="Easy">Easy</option>
                    <option value="Medium">Medium (University Standard)</option>
                    <option value="Hard">Hard (Final Honours Exam)</option>
                  </select>
                </div>

                <button type="submit" className="w-full py-3 bg-brand-600 text-white font-bold rounded-xl hover:bg-brand-700">
                  Generate Quiz Now
                </button>
              </form>
            </div>
          )}

          {/* ACTIVE QUIZ SCREEN */}
          {activeQuestions && !isFinished && (
            <div className="p-6 md:p-8 bg-white dark:bg-slate-800 rounded-3xl border border-slate-100 dark:border-slate-700 shadow-sm space-y-6">
              <div className="flex justify-between items-center text-xs">
                <span className="font-bold text-brand-600 uppercase">Question {currentIdx + 1} of {activeQuestions.length}</span>
                <span className="text-slate-400">{topic}</span>
              </div>

              <h3 className="font-bold text-base text-slate-800 dark:text-slate-100">
                {activeQuestions[currentIdx].q}
              </h3>

              <div className="space-y-2.5">
                {activeQuestions[currentIdx].options.map((opt, i) => {
                  const isSelected = selectedOptions[currentIdx] === opt;
                  return (
                    <button
                      key={i}
                      onClick={() => handleSelect(opt)}
                      className={`w-full text-left p-3.5 rounded-xl border text-xs font-semibold transition ${
                        isSelected
                          ? 'border-brand-600 bg-brand-50 dark:bg-brand-900/40 text-brand-700 dark:text-brand-300'
                          : 'border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/50'
                      }`}
                    >
                      {opt}
                    </button>
                  );
                })}
              </div>

              <div className="flex justify-between items-center pt-4 border-t border-slate-100 dark:border-slate-700">
                <button
                  disabled={currentIdx === 0}
                  onClick={() => setCurrentIdx(currentIdx - 1)}
                  className="text-xs font-bold text-slate-400 disabled:opacity-30"
                >
                  Previous
                </button>

                {currentIdx < activeQuestions.length - 1 ? (
                  <button
                    disabled={!selectedOptions[currentIdx]}
                    onClick={() => setCurrentIdx(currentIdx + 1)}
                    className="px-5 py-2 bg-brand-600 text-white font-bold text-xs rounded-xl disabled:opacity-40"
                  >
                    Next Question
                  </button>
                ) : (
                  <button
                    disabled={!selectedOptions[currentIdx]}
                    onClick={handleFinish}
                    className="px-5 py-2 bg-emerald-600 text-white font-bold text-xs rounded-xl disabled:opacity-40"
                  >
                    Submit Quiz
                  </button>
                )}
              </div>
            </div>
          )}

          {/* QUIZ RESULT SCORECARD */}
          {isFinished && (
            <div className="p-8 bg-white dark:bg-slate-800 rounded-3xl border border-slate-100 dark:border-slate-700 shadow-sm text-center space-y-5">
              <div className="w-16 h-16 mx-auto rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center font-black text-2xl">
                {score}/{activeQuestions.length}
              </div>
              <div>
                <h3 className="text-lg font-bold">Quiz Complete!</h3>
                <p className="text-xs text-slate-400 mt-1">
                  You scored {Math.round((score / activeQuestions.length) * 100)}% on {topic}.
                </p>
              </div>

              <div className="space-y-3 text-left">
                {activeQuestions.map((q, i) => (
                  <div key={i} className="p-3 bg-slate-50 dark:bg-slate-700/40 rounded-xl text-xs">
                    <p className="font-bold">{q.q}</p>
                    <p className="mt-1 text-slate-500">
                      Your answer: <span className={selectedOptions[i] === q.ans ? 'text-emerald-600 font-bold' : 'text-rose-500 font-bold'}>{selectedOptions[i]}</span>
                    </p>
                    {selectedOptions[i] !== q.ans && (
                      <p className="text-emerald-600">Correct: {q.ans}</p>
                    )}
                    <p className="mt-1 text-[11px] text-slate-400 italic">{q.exp}</p>
                  </div>
                ))}
              </div>

              <button
                onClick={() => setActiveQuestions(null)}
                className="px-5 py-2.5 bg-brand-600 text-white rounded-xl text-xs font-bold"
              >
                Take Another Quiz
              </button>
            </div>
          )}
        </div>
      );
    }

    // --- TEACHER: ATTENDANCE MANAGEMENT ---
    function TeacherAttendanceView({ db, onUpdateAttendance }) {
      const toggleAttendance = (courseId, increment) => {
        const updated = db.attendance.map(a => {
          if (a.courseId === courseId) {
            const nextPresent = increment ? Math.min(a.total + 1, a.present + 1) : Math.max(0, a.present - 1);
            return { ...a, total: a.total + (increment ? 1 : 0), present: nextPresent };
          }
          return a;
        });
        onUpdateAttendance(updated);
      };

      return (
        <div className="space-y-6 max-w-5xl mx-auto">
          <div>
            <h2 className="text-xl font-bold">Teacher: Daily Course Attendance Sheet</h2>
            <p className="text-xs text-slate-400">Mark presence or update roster records for registered sections.</p>
          </div>

          <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-100 dark:border-slate-700 overflow-hidden shadow-sm">
            <table className="w-full text-left text-xs">
              <thead className="bg-slate-50 dark:bg-slate-700/50 text-slate-400 uppercase font-bold border-b border-slate-100 dark:border-slate-700">
                <tr>
                  <th className="p-4">Course</th>
                  <th className="p-4 text-center">Total Sessions</th>
                  <th className="p-4 text-center">Student Present</th>
                  <th className="p-4 text-center">Quick Mark</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100 dark:divide-slate-700">
                {db.courses.map((c) => {
                  const att = db.attendance.find(a => a.courseId === c.id) || { total: 0, present: 0 };
                  return (
                    <tr key={c.id}>
                      <td className="p-4 font-bold">
                        {c.code} - {c.title}
                      </td>
                      <td className="p-4 text-center font-bold">{att.total}</td>
                      <td className="p-4 text-center text-emerald-600 font-bold">{att.present}</td>
                      <td className="p-4 text-center space-x-2">
                        <button
                          onClick={() => toggleAttendance(c.id, true)}
                          className="px-3 py-1 bg-emerald-100 text-emerald-700 dark:bg-emerald-950 dark:text-emerald-300 font-bold rounded-lg"
                        >
                          + Mark Present
                        </button>
                        <button
                          onClick={() => toggleAttendance(c.id, false)}
                          className="px-3 py-1 bg-rose-100 text-rose-700 dark:bg-rose-950 dark:text-rose-300 font-bold rounded-lg"
                        >
                          - Mark Absent
                        </button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // --- TEACHER: UPLOAD RESULTS ---
    function TeacherResultsView({ db, onAddResult }) {
      const [courseCode, setCourseCode] = useState('CSE-311');
      const [marks, setMarks] = useState(85);
      const [semester, setSemester] = useState(6);

      const handleSubmit = (e) => {
        e.preventDefault();
        const m = Number(marks);
        let grade = 'F';
        let gradePoint = 0.0;
        if (m >= 80) { grade = 'A+'; gradePoint = 4.0; }
        else if (m >= 75) { grade = 'A'; gradePoint = 3.75; }
        else if (m >= 70) { grade = 'A-'; gradePoint = 3.5; }
        else if (m >= 65) { grade = 'B+'; gradePoint = 3.25; }
        else if (m >= 60) { grade = 'B'; gradePoint = 3.0; }

        const course = db.courses.find(c => c.code === courseCode) || db.courses[0];
        onAddResult({
          semester: Number(semester),
          code: course.code,
          title: course.title,
          credit: course.credits,
          marks: m,
          grade,
          gradePoint
        });
        alert(`Recorded result for Alex Vance (${course.code}): Grade ${grade} (${gradePoint.toFixed(2)})`);
      };

      return (
        <div className="space-y-6 max-w-2xl mx-auto">
          <div>
            <h2 className="text-xl font-bold">Teacher: Student Marks & Grade Submission</h2>
            <p className="text-xs text-slate-400">Input semester marks; GPA and Grade Point will be calculated automatically.</p>
          </div>

          <form onSubmit={handleSubmit} className="p-6 bg-white dark:bg-slate-800 rounded-3xl border border-slate-100 dark:border-slate-700 shadow-sm space-y-4 text-xs">
            <div>
              <label className="block font-bold text-slate-400 uppercase mb-1">Student</label>
              <input type="text" disabled value="Alex Vance (CSE-2024-001)" className="w-full p-3 bg-slate-100 dark:bg-slate-700 rounded-xl" />
            </div>

            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="block font-bold text-slate-400 uppercase mb-1">Course</label>
                <select value={courseCode} onChange={(e) => setCourseCode(e.target.value)} className="w-full p-3 bg-slate-50 dark:bg-slate-700 rounded-xl">
                  {db.courses.map(c => (
                    <option key={c.id} value={c.code}>{c.code} - {c.title}</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block font-bold text-slate-400 uppercase mb-1">Semester</label>
                <input type="number" min="1" max="8" value={semester} onChange={(e) => setSemester(e.target.value)} className="w-full p-3 bg-slate-50 dark:bg-slate-700 rounded-xl" />
              </div>
            </div>

            <div>
              <label className="block font-bold text-slate-400 uppercase mb-1">Total Marks Obtained (out of 100)</label>
              <input type="number" min="0" max="100" value={marks} onChange={(e) => setMarks(e.target.value)} className="w-full p-3 bg-slate-50 dark:bg-slate-700 rounded-xl" />
            </div>

            <button type="submit" className="w-full py-3 bg-brand-600 text-white font-bold rounded-xl hover:bg-brand-700">
              Compute & Publish Result
            </button>
          </form>
        </div>
      );
    }

    // --- ADMIN: USERS VIEW ---
    function AdminUsersView({ users, onAddUser, onDeleteUser }) {
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [role, setRole] = useState('STUDENT');

      const handleAdd = (e) => {
        e.preventDefault();
        onAddUser({
          id: 'u_' + Date.now(),
          fullName: name,
          email,
          role,
          dept: 'CSE',
          batch: '55th',
          semester: 1
        });
        setName('');
        setEmail('');
      };

      return (
        <div className="space-y-6 max-w-5xl mx-auto">
          <div>
            <h2 className="text-xl font-bold">Admin: User Directory & Authorization</h2>
            <p className="text-xs text-slate-400">Manage Students, Faculty, and Administrative accounts.</p>
          </div>

          <form onSubmit={handleAdd} className="p-5 bg-white dark:bg-slate-800 rounded-2xl border border-slate-100 dark:border-slate-700 flex flex-wrap gap-3 text-xs">
            <input type="text" placeholder="Full Name" value={name} onChange={(e) => setName(e.target.value)} className="flex-1 min-w-[150px] p-2.5 bg-slate-50 dark:bg-slate-700 rounded-xl" required />
            <input type="email" placeholder="Institutional Email" value={email} onChange={(e) => setEmail(e.target.value)} className="flex-1 min-w-[150px] p-2.5 bg-slate-50 dark:bg-slate-700 rounded-xl" required />
            <select value={role} onChange={(e) => setRole(e.target.value)} className="p-2.5 bg-slate-50 dark:bg-slate-700 rounded-xl font-bold">
              <option value="STUDENT">STUDENT</option>
              <option value="TEACHER">TEACHER</option>
              <option value="ADMIN">ADMIN</option>
            </select>
            <button type="submit" className="px-5 py-2.5 bg-brand-600 text-white font-bold rounded-xl">Add User</button>
          </form>

          <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-100 dark:border-slate-700 overflow-hidden shadow-sm">
            <table className="w-full text-left text-xs">
              <thead className="bg-slate-50 dark:bg-slate-700/50 text-slate-400 uppercase font-bold border-b border-slate-100 dark:border-slate-700">
                <tr>
                  <th className="p-4">Name</th>
                  <th className="p-4">Email</th>
                  <th className="p-4 text-center">Role</th>
                  <th className="p-4 text-center">Action</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100 dark:divide-slate-700">
                {users.map(u => (
                  <tr key={u.id}>
                    <td className="p-4 font-bold">{u.fullName}</td>
                    <td className="p-4 text-slate-400">{u.email}</td>
                    <td className="p-4 text-center">
                      <span className="px-2.5 py-0.5 rounded-full font-bold text-[10px] bg-slate-100 dark:bg-slate-700">
                        {u.role}
                      </span>
                    </td>
                    <td className="p-4 text-center">
                      <button onClick={() => onDeleteUser(u.id)} className="text-slate-400 hover:text-rose-500">
                        <Icon name="trash" className="w-4 h-4 mx-auto" />
                      </button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // --- ADMIN: COURSES VIEW ---
    function AdminCoursesView({ courses, onAddCourse }) {
      const [code, setCode] = useState('');
      const [title, setTitle] = useState('');
      const [credits, setCredits] = useState(3.0);

      const handleAdd = (e) => {
        e.preventDefault();
        onAddCourse({
          id: 'c_' + Date.now(),
          code,
          title,
          credits: Number(credits),
          teacher: 'Assigned Faculty'
        });
        setCode('');
        setTitle('');
      };

      return (
        <div className="space-y-6 max-w-5xl mx-auto">
          <div>
            <h2 className="text-xl font-bold">Admin: Curriculum & Course Directory</h2>
            <p className="text-xs text-slate-400">Configure academic subjects, syllabus credits, and course allocations.</p>
          </div>

          <form onSubmit={handleAdd} className="p-5 bg-white dark:bg-slate-800 rounded-2xl border border-slate-100 dark:border-slate-700 flex flex-wrap gap-3 text-xs">
            <input type="text" placeholder="Course Code (e.g. CSE-421)" value={code} onChange={(e) => setCode(e.target.value)} className="w-36 p-2.5 bg-slate-50 dark:bg-slate-700 rounded-xl" required />
            <input type="text" placeholder="Course Title" value={title} onChange={(e) => setTitle(e.target.value)} className="flex-1 min-w-[200px] p-2.5 bg-slate-50 dark:bg-slate-700 rounded-xl" required />
            <input type="number" step="0.5" placeholder="Credits" value={credits} onChange={(e) => setCredits(e.target.value)} className="w-24 p-2.5 bg-slate-50 dark:bg-slate-700 rounded-xl" required />
            <button type="submit" className="px-5 py-2.5 bg-brand-600 text-white font-bold rounded-xl">Add Course</button>
          </form>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {courses.map(c => (
              <div key={c.id} className="p-5 bg-white dark:bg-slate-800 rounded-2xl border border-slate-100 dark:border-slate-700 shadow-sm flex justify-between items-center">
                <div>
                  <span className="text-[10px] font-bold text-brand-600 uppercase">{c.code}</span>
                  <h4 className="font-bold text-sm mt-0.5">{c.title}</h4>
                  <p className="text-xs text-slate-400 mt-1">Instructor: {c.teacher || 'Unassigned'}</p>
                </div>
                <span className="px-3 py-1 bg-brand-50 dark:bg-brand-900/40 text-brand-600 font-extrabold text-xs rounded-xl">
                  {c.credits.toFixed(1)} Credits
                </span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // Mount Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
